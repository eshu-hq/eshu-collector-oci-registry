# CI gates for eshu-collector-oci-registry.
#
# Thin wrapper around the shared reusable lanes: the lane bodies live in
# eshu-hq/.github/.github/workflows/go-collector-ci.yml, pinned by SHA
# below. Inner job names stay the org contract (lint, test, race, shell,
# image, boundary, govulncheck, gosec, actionlint, ci-complete); the
# required ruleset context is `go-ci / ci-complete`.
#
# This file owns only the paths-filter, the run-* wiring per change class,
# the repo-specific hook commands (boundary test, image seed + digest
# pins), the coverage floor (may only rise; finish line is 90%), and the
# schedule-only findings filing. Everything else is the reusable.
#
# Pinned actions (SHAs synced with the uses: lines below; re-verify with
# git ls-remote when auditing; Dependabot github-actions proposes bumps,
# weekly grouped):
#   actions/checkout v7.0.1              3d3c42e5aac5ba805825da76410c181273ba90b1
#   dorny/paths-filter v4                ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
# Reusable pin (peeled commit SHA with version comment, never a mutable
# tag; re-pin deliberately after reviewing the upstream diff):
#   eshu-hq/.github go-collector-ci v2    4d01ab90baf5dd77c21cc1ee6bdf701332613449


name: ci

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * 1" # weekly Monday 03:00 UTC: govulncheck + gosec only
  workflow_dispatch: # manual runs execute every lane, like a push

permissions:
  contents: read

# Cancel superseded runs per PR (or per ref for pushes and schedules).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Runs on every event on purpose: on push the filter outputs are unused
    # (lane conditions short-circuit on event), but every lane `needs` this
    # job — skipping it on push drags all lanes to skipped and the push run
    # goes vacantly green (observed on post-merge main run 40611978095).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      fixtures: ${{ steps.filter.outputs.fixtures }}
      shell: ${{ steps.filter.outputs.shell }}
      deps: ${{ steps.filter.outputs.deps }}
      image: ${{ steps.filter.outputs.image }}
      workflows: ${{ steps.filter.outputs.workflows }}
      misc: ${{ steps.filter.outputs.misc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          # Needed so the `misc` catch-all below can use `!` negations;
          # groups without negations behave exactly as before.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
            fixtures:
              # Every entry is grep-proven test- or embed-consumed:
              # **/*.json via grant_test.go:37
              # (os.ReadFile grant.example.json),
              # manifest.yaml via manifest_embed.go:12
              # (go:embed manifest.yaml) plus manifest_test.go:21
              # (os.ReadFile manifest.yaml),
              # grant.example.json via grant_test.go:37,
              # config.example.yaml via config_test.go:106
              # (os.ReadFile config.example.yaml).
              # There is no testdata/ directory in this repo. JSON or YAML
              # added under a future testdata/ hits '**/*.json' here and
              # runs test only; anything else unclassified (a Makefile, a
              # future testdata/*.go.txt golden) falls into misc and runs
              # the full Go lanes (fail closed).
              - '**/*.json'
              - 'manifest.yaml'
              - 'grant.example.json'
              - 'config.example.yaml'
            shell:
              - '**/*.sh'
            deps:
              - 'go.mod'
              - 'go.sum'
            image:
              # manifest.yaml is go:embed'ed into the binary
              # (manifest_embed.go:12), so a manifest change rebuilds
              # the image.
              - 'Dockerfile'
              - '.dockerignore'
              - 'manifest.yaml'
            workflows:
              - '.github/workflows/**'
            misc:
              # Default required by the epic: anything not classified above
              # runs the full Go lanes. Docs-only must keep skipping, so the
              # docs skip set stays negated here; every classified pattern is
              # negated too so narrow lanes (fixtures/shell/image) keep their
              # shape. Proven by the docs-only / fixture-only skip proofs.
              - '**'
              - '!**/*.md'
              - '!LICENSE'
              - '!CODEOWNERS'
              - '!**/*.go'
              - '!go.mod'
              - '!go.sum'
              - '!.golangci.yml'
              - '!**/*.json'
              - '!manifest.yaml'
              - '!grant.example.json'
              - '!config.example.yaml'
              - '!**/*.sh'
              - '!Dockerfile'
              - '!.dockerignore'
              - '!.github/workflows/**'

  go-ci:
    # No `if:` on purpose: the reusable gates each lane on its run-*
    # input, and skipping this job would drag every lane to skipped.
    # (A `uses` job cannot carry timeout-minutes; the called lanes carry
    # their own.) No secrets pass down: the reusable needs none.
    needs: [changes]
    uses: eshu-hq/.github/.github/workflows/go-collector-ci.yml@4d01ab90baf5dd77c21cc1ee6bdf701332613449 # v2
    with:
      module: eshu-collector-oci-registry
      working-directory: .
      go-version-file: go.mod
      coverage-floor: 90.5
      run-lint: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true' }}
      run-test: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.fixtures == 'true' || needs.changes.outputs.shell == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true' }}
      run-race: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true' }}
      run-shell: ${{ github.event_name != 'pull_request' || needs.changes.outputs.shell == 'true' }}
      run-image: ${{ github.event_name != 'pull_request' || needs.changes.outputs.image == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true' }}
      image-tag: eshu-collector-oci-registry:ci
      image-context: .
      image-command: |
        seed="$RUNNER_TEMP/seed"
        mkdir -p "$seed" && chmod 777 "$seed"
        docker run --rm --network none -v "$seed:/component" eshu-collector-oci-registry:ci seed --dest /component
        test -x "$seed/collector"
        test -s "$seed/manifest.yaml"
        set -euo pipefail
        total=$(grep -Ec '^[[:space:]]*image:' manifest.yaml)
        pinned=$(grep -Ec '^[[:space:]]*image:[[:space:]]*[^[:space:]#]+@sha256:[0-9a-f]{64}[[:space:]]*$' manifest.yaml)
        echo "manifest image refs: $pinned/$total digest-pinned"
        [ "$pinned" -ge 1 ] && [ "$pinned" -eq "$total" ]
        from_total=$(grep -Ec '^[[:space:]]*FROM ' Dockerfile)
        from_pinned=$(grep -Ec '^[[:space:]]*FROM [^[:space:]]+@sha256:[0-9a-f]{64}' Dockerfile)
        echo "Dockerfile bases: $from_pinned/$from_total digest-pinned"
        [ "$from_pinned" -eq "$from_total" ]
      run-boundary: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true' }}
      boundary-command: go test -count=1 -run TestImportBoundaryRejectsCoreAndCrossCollectorImports .
      run-govulncheck: ${{ github.event_name != 'pull_request' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflows == 'true' }}
      run-gosec: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true' }}
      gosec-fail-on-findings: ${{ github.event_name == 'schedule' }}
      gosec-version: v2.30.0
      run-actionlint: ${{ github.event_name != 'pull_request' || needs.changes.outputs.workflows == 'true' }}

  vuln-filing:
    # Schedule-only notification: files or updates the govulncheck findings
    # issue when the reusable lane fails. The lane-conclusion gate keeps a
    # lint/test/image/race failure on schedule from filing a mislabeled
    # security-findings issue. Fork-PR safety: GH_TOKEN is the automatic
    # token, and this job only runs on schedule.
    needs: [go-ci]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      checks: read
    steps:
      - name: file or update findings issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          lane=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs?check_name=go-ci%20%2F%20govulncheck&status=completed" --jq '.check_runs[0].conclusion')
          if [ "$lane" != "failure" ]; then
            echo "govulncheck lane concluded $lane, not failure; not filing."
            exit 0
          fi
          title="[govulncheck] findings $(date -u +%F)"
          body="Scheduled govulncheck failed on ${{ github.sha }}. See run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          open=$(gh issue list --search "$title in:title" --state open --json number --jq '.[0].number')
          if [ -n "$open" ] && [ "$open" != "null" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  sec-filing:
    # Schedule-only notification for gosec findings (mirror of vuln-filing,
    # gated on its own lane conclusion the same way).
    needs: [go-ci]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      checks: read
    steps:
      - name: file or update findings issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          lane=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs?check_name=go-ci%20%2F%20gosec&status=completed" --jq '.check_runs[0].conclusion')
          if [ "$lane" != "failure" ]; then
            echo "gosec lane concluded $lane, not failure; not filing."
            exit 0
          fi
          title="[gosec] findings $(date -u +%F)"
          body="Scheduled gosec failed on ${{ github.sha }}. See run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          open=$(gh issue list --search "$title in:title" --state open --json number --jq '.[0].number')
          if [ -n "$open" ] && [ "$open" != "null" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
